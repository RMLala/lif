name = "lifeos-cloud-api"
main = "src/index.js"
compatibility_date = "2026-11-05"

[[d1_databases]]
binding = "DB"
database_name = "lifeos-cloud"
database_id = "REPLACE_WITH_LIFEOS_CLOUD_D1_ID"
migrations_dir = "migrations"

[[d1_databases]]
binding = "LICENSES"
database_name = "lifeos-licenses"
database_id = "REPLACE_WITH_THE_SAME_LIFEOS_LICENSES_D1_ID"

[vars]
APP_ORIGINS = "https://localhost"
DAILY_SYNC_LIMIT = "5000"
