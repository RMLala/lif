name: Android Debug and signed Release API23/API29

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install, test, and sync Android assets
        run: |
          npm ci
          npm test
          npm run android:sync
      - name: Build Debug API23 and API29
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleApi23Debug :app:assembleApi29Debug
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-6.7.0-Debug-API23
          path: android/app/build/outputs/apk/api23/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-6.7.0-Debug-API29
          path: android/app/build/outputs/apk/api29/debug/*.apk
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify organization signing secrets
        shell: bash
        run: |
          for key in KEYSTORE_BASE64 KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!key}" ]; then echo "::error::Required signing secret missing: $key"; exit 1; fi
          done
      - name: Install, test, and sync Android assets
        run: |
          npm ci
          npm test
          npm run android:sync
      - name: Build signed Release API23 and API29
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleApi23Release :app:assembleApi29Release
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-6.7.0-Release-API23
          path: android/app/build/outputs/apk/api23/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-6.7.0-Release-API29
          path: android/app/build/outputs/apk/api29/release/*.apk
          if-no-files-found: error
